# CUDA torch for the map matcher. 6 November 2026.
#
# The system python3 has torch 2.3.1 built WITHOUT CUDA
# (torch.version.cuda is None), so XFeat and LighterGlue were running on one
# CPU core - _load() sets torch.set_num_threads(1) on purpose, after 9 Oct,
# when torch's own thread pool fighting the main loop was recorded as "main
# loop stalled 44 s and 30 s" and wrongly blamed on stereo depth.
#
# Measured on 12 cruise frames of 494 at 85-102 m, then on 44 frames of
# 494+486 against the raw M9N:
#
#     matcher      CPU ms    GPU ms    CPU ok/err      GPU ok/err
#     xfeat         277.7      52      31/44 8.02 m    31/44 8.05 m
#     xfeat_lg     1910.2     104      35/44 7.53 m    35/44 7.66 m
#     ncc            92.6      96      -               -   (OpenCV, not torch)
#
# The same fixes, 18x faster on LighterGlue. It matters because the flight
# logs put xfeat_lg's fix_age_s at 1.56-2.02 s, max 2.21 s - at 4 m/s a fix
# landing 8 m behind the aircraft. NCC is unchanged because it is OpenCV, and
# this OpenCV build reports 0 CUDA devices.
#
# Nothing of the flow changes: the matcher only runs above map_min_alt_m,
# 60 m. On the ground, where it never runs, run 501 with this env read
# cpu p50 273.1% against 500's 270.8%, MainThread 97% in both.
#
# torch-cuda/ is a pip --target install - 232 MB torch 2.11.0 cu126 cp310
# from pypi.jetson-ai-lab.io, plus 109 MB nvidia-cudss-cu12 0.8.0.10 because
# libtorch_cuda.so wants libcudss.so.0 and nothing on this image had it. The
# system install is untouched, so removing these two lines puts the aircraft
# straight back on CPU torch.
[Service]
Environment=PYTHONPATH=/data/DRONE/torch-cuda
Environment=LD_LIBRARY_PATH=/data/DRONE/torch-cuda/nvidia/cu12/lib
